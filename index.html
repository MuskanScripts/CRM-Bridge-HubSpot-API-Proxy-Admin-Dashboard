<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HubSpot CRM API Proxy - Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      height: 90vh;
    }

    .sidebar {
      width: 250px;
      background: #2c3e50;
      color: white;
      overflow-y: auto;
      padding: 20px 0;
    }

    .logo {
      padding: 20px;
      border-bottom: 1px solid #34495e;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #3498db;
    }

    .auth-section {
      padding: 15px;
      border-bottom: 1px solid #34495e;
    }

    .auth-section label {
      display: block;
      font-size: 12px;
      color: #95a5a6;
      margin-bottom: 5px;
    }

    .auth-section input {
      width: 100%;
      padding: 8px;
      border: 1px solid #34495e;
      background: #34495e;
      color: white;
      border-radius: 4px;
      font-size: 12px;
    }

    .auth-section input::placeholder {
      color: #7f8c8d;
    }

    .nav-menu {
      list-style: none;
      padding: 10px 0;
    }

    .nav-menu li {
      margin: 0;
    }

    .nav-menu button {
      width: 100%;
      padding: 12px 20px;
      background: transparent;
      color: #ecf0f1;
      border: none;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .nav-menu button:hover {
      background: #34495e;
      color: #3498db;
    }

    .nav-menu button.active {
      background: #3498db;
      color: white;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #ecf0f1;
      padding: 20px;
      border-bottom: 1px solid #bdc3c7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 24px;
      color: #2c3e50;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #3498db;
      color: white;
    }

    .btn-primary:hover {
      background: #2980b9;
    }

    .btn-success {
      background: #27ae60;
      color: white;
    }

    .btn-success:hover {
      background: #229954;
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .btn-secondary {
      background: #95a5a6;
      color: white;
    }

    .btn-secondary:hover {
      background: #7f8c8d;
    }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .search-bar {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }

    .search-bar input {
      flex: 1;
      padding: 10px;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 14px;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    thead {
      background: #34495e;
      color: white;
    }

    th {
      padding: 12px;
      text-align: left;
      font-weight: 600;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #ecf0f1;
    }

    tbody tr:hover {
      background: #f8f9fa;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #2c3e50;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #2c3e50;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .action-buttons {
      display: flex;
      gap: 5px;
    }

    .action-buttons button {
      padding: 6px 10px;
      font-size: 12px;
    }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .alert-info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #95a5a6;
    }

    .spinner {
      border: 4px solid #ecf0f1;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #95a5a6;
    }

    .detail-view {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e9ecef;
    }

    .detail-row strong {
      color: #2c3e50;
    }

    .detail-row span {
      color: #555;
    }

    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid #ecf0f1;
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 20px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #7f8c8d;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }

    .tab.active {
      color: #3498db;
      border-bottom-color: #3498db;
    }

    .tab:hover {
      color: #2c3e50;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="logo">🚀 HubSpot CRM</div>
      
      <div class="auth-section">
        <label>API Token</label>
        <input 
          type="password" 
          id="authToken" 
          placeholder="Enter Bearer token"
          autocomplete="off"
        >
      </div>

      <ul class="nav-menu">
        <li><button class="nav-btn active" data-view="contacts">👥 Contacts</button></li>
        <li><button class="nav-btn" data-view="deals">💼 Deals</button></li>
        <li><button class="nav-btn" data-view="companies">🏢 Companies</button></li>
        <li><button class="nav-btn" data-view="tickets">🎫 Tickets</button></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <div class="header">
        <h1 id="pageTitle">Contacts</h1>
        <div class="header-buttons">
          <button class="btn btn-primary" id="createBtn" onclick="openCreateModal()">+ New</button>
          <button class="btn btn-secondary" id="refreshBtn" onclick="refreshCurrentView()">🔄 Refresh</button>
        </div>
      </div>

      <!-- Content Area -->
      <div class="content-area">
        <div class="alert" id="alert"></div>

        <!-- CONTACTS VIEW -->
        <div class="view active" id="contacts-view">
          <div class="search-bar">
            <input 
              type="text" 
              id="contactSearch" 
              placeholder="Search contacts by name or email..."
            >
            <button class="btn btn-secondary" onclick="searchContacts()">Search</button>
          </div>
          <div id="contactsList"></div>
        </div>

        <!-- DEALS VIEW -->
        <div class="view" id="deals-view">
          <div class="search-bar">
            <input 
              type="text" 
              id="dealSearch" 
              placeholder="Search deals by name..."
            >
            <button class="btn btn-secondary" onclick="searchDeals()">Search</button>
          </div>
          <div id="dealsList"></div>
        </div>

        <!-- COMPANIES VIEW -->
        <div class="view" id="companies-view">
          <div class="search-bar">
            <input 
              type="text" 
              id="companySearch" 
              placeholder="Search companies..."
            >
            <button class="btn btn-secondary" onclick="searchCompanies()">Search</button>
          </div>
          <div id="companiesList"></div>
        </div>

        <!-- TICKETS VIEW -->
        <div class="view" id="tickets-view">
          <div class="search-bar">
            <input 
              type="text" 
              id="ticketSearch" 
              placeholder="Search tickets..."
            >
            <button class="btn btn-secondary" onclick="refreshCurrentView()">Search</button>
          </div>
          <div id="ticketsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CREATE/EDIT MODAL -->
  <div class="modal" id="formModal">
    <div class="modal-content">
      <div class="modal-header" id="modalTitle">Create New Contact</div>
      <form id="entityForm" onsubmit="handleFormSubmit(event)">
        <div id="formFields"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-success">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DETAIL MODAL -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header" id="detailTitle"></div>
      <div id="detailContent"></div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="deleteDetailBtn" onclick="deleteFromDetail()">Delete</button>
        <button class="btn btn-primary" id="editDetailBtn" onclick="editFromDetail()">Edit</button>
        <button class="btn btn-secondary" onclick="closeDetailModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'http://localhost:7986';
    let currentResource = 'contacts';
    let selectedEntity = null;

    // Get auth token from input
    function getAuthHeader() {
      const token = document.getElementById('authToken').value.trim();
      if (!token) {
        showAlert('Please enter your HubSpot API token', 'error');
        return null;
      }
      const headerToken = token.startsWith('Bearer ') ? token : `Bearer ${token}`;
      return { 'Authorization': headerToken };
    }

    // Show alerts
    function showAlert(message, type = 'info') {
      const alert = document.getElementById('alert');
      alert.textContent = message;
      alert.className = `alert show alert-${type}`;
      setTimeout(() => alert.classList.remove('show'), 5000);
    }

    // Navigation
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentResource = e.target.dataset.view;
        switchView(currentResource);
      });
    });

    function switchView(resource) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(`${resource}-view`).classList.add('active');
      
      const titles = {
        contacts: 'Contacts',
        deals: 'Deals',
        companies: 'Companies',
        tickets: 'Tickets'
      };
      document.getElementById('pageTitle').textContent = titles[resource];
      
      refreshCurrentView();
    }

    function refreshCurrentView() {
      if (currentResource === 'contacts') fetchContacts();
      else if (currentResource === 'deals') fetchDeals();
      else if (currentResource === 'companies') fetchCompanies();
      else if (currentResource === 'tickets') fetchTickets();
    }

    // ========== CONTACTS ==========
    async function fetchContacts() {
      const headers = getAuthHeader();
      if (!headers) return;

      const container = document.getElementById('contactsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading contacts...</div>';

      try {
        const response = await fetch(`${API_BASE_URL}/contacts`, { headers });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Failed to fetch contacts');

        const contacts = data.results || data.objects || [];
        if (contacts.length === 0) {
          container.innerHTML = '<div class="no-results">No contacts found</div>';
          return;
        }

        let html = '<div class="table-container"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
        contacts.forEach(contact => {
          const props = contact.properties || {};
          const name = `${props.firstname || ''} ${props.lastname || ''}`.trim() || 'N/A';
          const email = props.email || 'N/A';
          const status = props.hs_lead_status || 'N/A';
          html += `<tr>
            <td>${name}</td>
            <td>${email}</td>
            <td>${status}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-primary" onclick="viewEntity('contacts', '${contact.id}')">View</button>
                <button class="btn btn-danger" onclick="deleteEntity('contacts', '${contact.id}')">Delete</button>
              </div>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
        showAlert(error.message, 'error');
      }
    }

    async function searchContacts() {
      const query = document.getElementById('contactSearch').value.trim();
      if (!query) {
        fetchContacts();
        return;
      }

      const headers = getAuthHeader();
      if (!headers) return;

      const container = document.getElementById('contactsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

      try {
        const body = {
          filterGroups: [{
            filters: [{
              propertyName: 'email',
              operator: 'CONTAINS_TOKEN',
              value: query
            }]
          }],
          limit: 100
        };

        const response = await fetch(`${API_BASE_URL}/contacts/search`, {
          method: 'POST',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Search failed');

        const contacts = data.results || [];
        if (contacts.length === 0) {
          container.innerHTML = '<div class="no-results">No contacts found</div>';
          return;
        }

        let html = '<div class="table-container"><table><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead><tbody>';
        contacts.forEach(contact => {
          const props = contact.properties || {};
          const name = `${props.firstname || ''} ${props.lastname || ''}`.trim() || 'N/A';
          const email = props.email || 'N/A';
          const status = props.hs_lead_status || 'N/A';
          html += `<tr>
            <td>${name}</td>
            <td>${email}</td>
            <td>${status}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-primary" onclick="viewEntity('contacts', '${contact.id}')">View</button>
                <button class="btn btn-danger" onclick="deleteEntity('contacts', '${contact.id}')">Delete</button>
              </div>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
        showAlert(error.message, 'error');
      }
    }

    // ========== DEALS ==========
    async function fetchDeals() {
      const headers = getAuthHeader();
      if (!headers) return;

      const container = document.getElementById('dealsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading deals...</div>';

      try {
        const response = await fetch(`${API_BASE_URL}/deals`, { headers });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Failed to fetch deals');

        const deals = data.results || data.objects || [];
        if (deals.length === 0) {
          container.innerHTML = '<div class="no-results">No deals found</div>';
          return;
        }

        let html = '<div class="table-container"><table><thead><tr><th>Deal Name</th><th>Amount</th><th>Stage</th><th>Actions</th></tr></thead><tbody>';
        deals.forEach(deal => {
          const props = deal.properties || {};
          const name = props.dealname || 'N/A';
          const amount = props.amount ? `$${props.amount}` : 'N/A';
          const stage = props.dealstage || 'N/A';
          html += `<tr>
            <td>${name}</td>
            <td>${amount}</td>
            <td>${stage}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-primary" onclick="viewEntity('deals', '${deal.id}')">View</button>
                <button class="btn btn-danger" onclick="deleteEntity('deals', '${deal.id}')">Delete</button>
              </div>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
        showAlert(error.message, 'error');
      }
    }

    async function searchDeals() {
      const query = document.getElementById('dealSearch').value.trim();
      if (!query) {
        fetchDeals();
        return;
      }

      const headers = getAuthHeader();
      if (!headers) return;

      const container = document.getElementById('dealsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

      try {
        const body = {
          filterGroups: [{
            filters: [{
              propertyName: 'dealname',
              operator: 'CONTAINS_TOKEN',
              value: query
            }]
          }],
          limit: 100
        };

        const response = await fetch(`${API_BASE_URL}/deals/search`, {
          method: 'POST',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Search failed');

        const deals = data.results || [];
        if (deals.length === 0) {
          container.innerHTML = '<div class="no-results">No deals found</div>';
          return;
        }

        let html = '<div class="table-container"><table><thead><tr><th>Deal Name</th><th>Amount</th><th>Stage</th><th>Actions</th></tr></thead><tbody>';
        deals.forEach(deal => {
          const props = deal.properties || {};
          const name = props.dealname || 'N/A';
          const amount = props.amount ? `$${props.amount}` : 'N/A';
          const stage = props.dealstage || 'N/A';
          html += `<tr>
            <td>${name}</td>
            <td>${amount}</td>
            <td>${stage}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-primary" onclick="viewEntity('deals', '${deal.id}')">View</button>
                <button class="btn btn-danger" onclick="deleteEntity('deals', '${deal.id}')">Delete</button>
              </div>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
        showAlert(error.message, 'error');
      }
    }

    // ========== COMPANIES ==========
    async function fetchCompanies() {
      const headers = getAuthHeader();
      if (!headers) return;

      const container = document.getElementById('companiesList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading companies...</div>';

      try {
        const response = await fetch(`${API_BASE_URL}/companies?limit=100`, { headers });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Failed to fetch companies');

        const companies = data.results || data.objects || [];
        if (companies.length === 0) {
          container.innerHTML = '<div class="no-results">No companies found</div>';
          return;
        }

        let html = '<div class="table-container"><table><thead><tr><th>Company Name</th><th>Website</th><th>Industry</th><th>Actions</th></tr></thead><tbody>';
        companies.forEach(company => {
          const props = company.properties || {};
          const name = props.name || 'N/A';
          const website = props.website || 'N/A';
          const industry = props.industry || 'N/A';
          html += `<tr>
            <td>${name}</td>
            <td>${website}</td>
            <td>${industry}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-primary" onclick="viewEntity('companies', '${company.id}')">View</button>
                <button class="btn btn-danger" onclick="deleteEntity('companies', '${company.id}')">Delete</button>
              </div>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
        showAlert(error.message, 'error');
      }
    }

    async function searchCompanies() {
      const query = document.getElementById('companySearch').value.trim();
      if (!query) {
        fetchCompanies();
        return;
      }

      const headers = getAuthHeader();
      if (!headers) return;

      const container = document.getElementById('companiesList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';

      try {
        const body = {
          filterGroups: [{
            filters: [{
              propertyName: 'name',
              operator: 'CONTAINS_TOKEN',
              value: query
            }]
          }],
          limit: 100
        };

        const response = await fetch(`${API_BASE_URL}/companies/search`, {
          method: 'POST',
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Search failed');

        const companies = data.results || [];
        if (companies.length === 0) {
          container.innerHTML = '<div class="no-results">No companies found</div>';
          return;
        }

        let html = '<div class="table-container"><table><thead><tr><th>Company Name</th><th>Website</th><th>Industry</th><th>Actions</th></tr></thead><tbody>';
        companies.forEach(company => {
          const props = company.properties || {};
          const name = props.name || 'N/A';
          const website = props.website || 'N/A';
          const industry = props.industry || 'N/A';
          html += `<tr>
            <td>${name}</td>
            <td>${website}</td>
            <td>${industry}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-primary" onclick="viewEntity('companies', '${company.id}')">View</button>
                <button class="btn btn-danger" onclick="deleteEntity('companies', '${company.id}')">Delete</button>
              </div>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
        showAlert(error.message, 'error');
      }
    }

    // ========== TICKETS ==========
    async function fetchTickets() {
      const headers = getAuthHeader();
      if (!headers) return;

      const container = document.getElementById('ticketsList');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading tickets...</div>';

      try {
        const response = await fetch(`${API_BASE_URL}/tickets?limit=100`, { headers });
        const data = await response.json();

        if (!response.ok) throw new Error(data.error || 'Failed to fetch tickets');

        const tickets = data.results || data.objects || [];
        if (tickets.length === 0) {
          container.innerHTML = '<div class="no-results">No tickets found</div>';
          return;
        }

        let html = '<div class="table-container"><table><thead><tr><th>Subject</th><th>Status</th><th>Priority</th><th>Actions</th></tr></thead><tbody>';
        tickets.forEach(ticket => {
          const props = ticket.properties || {};
          const subject = props.subject || 'N/A';
          const status = props.hs_ticket_status || 'N/A';
          const priority = props.hs_ticket_priority || 'N/A';
          html += `<tr>
            <td>${subject}</td>
            <td>${status}</td>
            <td>${priority}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-primary" onclick="viewEntity('tickets', '${ticket.id}')">View</button>
                <button class="btn btn-danger" onclick="deleteEntity('tickets', '${ticket.id}')">Delete</button>
              </div>
            </td>
          </tr>`;
        });
        html += '</tbody></table></div>';
        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `<div class="no-results">Error: ${error.message}</div>`;
        showAlert(error.message, 'error');
      }
    }

    // ========== ENTITY OPERATIONS ==========

          <div class="form-group">

      } else if (currentResource === 'tickets') {

          <div class="form-group">

            <select name="hs_ticket_status">
              <option value="">Select Status</option>

              <option value="OPEN">Open</option>

    function closeModal() {
      document.getElementById('formModal').classList.remove('active');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('active');
    }

    async function handleFormSubmit(event) {
      event.preventDefault();
      const headers = getAuthHeader();
      if (!headers) return;

      const formData = new FormData(document.getElementById('entityForm'));
      const properties = {};
      formData.forEach((value, key) => {
        if (value) properties[key] = value;
      });

      try {
        const url = selectedEntity 
          ? `${API_BASE_URL}/${currentResource}/${selectedEntity.id}`
          : `${API_BASE_URL}/${currentResource}`;
        
        const method = selectedEntity ? 'PATCH' : 'POST';
        const body = currentResource === 'tickets' 
          ? { properties }
          : currentResource === 'deals' || currentResource === 'companies'
            ? { properties }
            : { properties };

        const response = await fetch(url, {
          method,
          headers: { ...headers, 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Request failed');
        }

        showAlert(selectedEntity ? 'Updated successfully!' : 'Created successfully!', 'success');
        closeModal();
        refreshCurrentView();
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    async function viewEntity(resource, id) {
      const headers = getAuthHeader();
      if (!headers) return;

      try {
        const response = await fetch(`${API_BASE_URL}/${resource}/${id}`, { headers });
        if (!response.ok) throw new Error('Failed to fetch entity');

        const entity = await response.json();
        selectedEntity = entity;

        let content = '<div class="detail-view">';
        const props = entity.properties || {};

        if (resource === 'contacts') {
          content += `
            <div class="detail-row"><strong>Name:</strong> <span>${props.firstname || ''} ${props.lastname || ''}</span></div>
            <div class="detail-row"><strong>Email:</strong> <span>${props.email || 'N/A'}</span></div>
            <div class="detail-row"><strong>Status:</strong> <span>${props.hs_lead_status || 'N/A'}</span></div>
            <div class="detail-row"><strong>Phone:</strong> <span>${props.phone || 'N/A'}</span></div>
            <div class="detail-row"><strong>Company:</strong> <span>${props.company || 'N/A'}</span></div>
          `;
        } else if (resource === 'deals') {
          content += `
            <div class="detail-row"><strong>Deal Name:</strong> <span>${props.dealname || 'N/A'}</span></div>
            <div class="detail-row"><strong>Amount:</strong> <span>$${props.amount || '0'}</span></div>
            <div class="detail-row"><strong>Stage:</strong> <span>${props.dealstage || 'N/A'}</span></div>
            <div class="detail-row"><strong>Close Date:</strong> <span>${props.closedate || 'N/A'}</span></div>
          `;
        } else if (resource === 'companies') {
          content += `
            <div class="detail-row"><strong>Company Name:</strong> <span>${props.name || 'N/A'}</span></div>
            <div class="detail-row"><strong>Website:</strong> <span>${props.website || 'N/A'}</span></div>
            <div class="detail-row"><strong>Industry:</strong> <span>${props.industry || 'N/A'}</span></div>
            <div class="detail-row"><strong>Employees:</strong> <span>${props.numberofemployees || 'N/A'}</span></div>
            <div class="detail-row"><strong>Phone:</strong> <span>${props.phone || 'N/A'}</span></div>
          `;
        } else if (resource === 'tickets') {
          content += `
            <div class="detail-row"><strong>Subject:</strong> <span>${props.subject || 'N/A'}</span></div>
            <div class="detail-row"><strong>Status:</strong> <span>${props.hs_ticket_status || 'N/A'}</span></div>
            <div class="detail-row"><strong>Priority:</strong> <span>${props.hs_ticket_priority || 'N/A'}</span></div>
            <div class="detail-row"><strong>Description:</strong> <span>${props.content || 'N/A'}</span></div>
          `;
        }

        content += '</div>';
        document.getElementById('detailTitle').textContent = `${resource.charAt(0).toUpperCase() + resource.slice(1)} Details`;
        document.getElementById('detailContent').innerHTML = content;
        document.getElementById('detailModal').classList.add('active');
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    function editFromDetail() {
      closeDetailModal();
      // Populate form with existing data
      openCreateModal();
      // This would require more complex logic to populate the form
      showAlert('Edit functionality limited - use delete and recreate for now', 'info');
    }

    async function deleteFromDetail() {
      if (confirm('Are you sure you want to delete this item?')) {
        await deleteEntity(currentResource, selectedEntity.id);
        closeDetailModal();
      }
    }

    async function deleteEntity(resource, id) {
      const headers = getAuthHeader();
      if (!headers) return;

      if (!confirm('Are you sure you want to delete this item?')) return;

      try {
        const response = await fetch(`${API_BASE_URL}/${resource}/${id}`, {
          method: 'DELETE',
          headers
        });

        if (!response.ok) throw new Error('Delete failed');

        showAlert('Deleted successfully!', 'success');
        refreshCurrentView();
      } catch (error) {
        showAlert(error.message, 'error');
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Load initial data if token is present
      const token = localStorage.getItem('hubspotToken');
      if (token) {
        document.getElementById('authToken').value = token;
      }
      
      // Save token when changed
      document.getElementById('authToken').addEventListener('change', (e) => {
        localStorage.setItem('hubspotToken', e.target.value);
      });
    });
  </script>
